            }),
            React.createElement("button", {
                onClick: onSend,
                disabled: disabled,
                style: { width: "48px", height: "48px", background: disabled ? "#eee" : "#000", color: "#fff", border: "none", borderRadius: "8px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" },
            }, disabled ? "..." : "➤"),
        );

    // ==========================================
    // MAIN APP
    // ==========================================

    const App = () => {
        const [view, setView] = React.useState("main");
        const [apiKey, setApiKey] = React.useState("");
        const [selectedModel, setSelectedModel] = React.useState("gemini-2.0-flash-exp");
        const [messages, setMessages] = React.useState([{ role: "bot", content: "**Vibe Legal V7.2 (Style Menu)** ready." }]);
        const [inputValue, setInputValue] = React.useState("");
        const [isProcessing, setIsProcessing] = React.useState(false);

        React.useEffect(() => {
            const k = localStorage.getItem("vibe_api_key");
            const m = localStorage.getItem("vibe_model");
            if (k) setApiKey(k);
            if (m) setSelectedModel(m);
        }, []);

        const handleAction = async () => {
            if (!apiKey) return setView("settings");
            if (!inputValue.trim()) return;

            const currentInput = inputValue;
            setInputValue("");
            setMessages((p) => [...p, { role: "user", content: currentInput }]);
            setIsProcessing(true);

            try {
                await Word.run(async (context) => {
                    // 1. Generate Document Map (Two-Phase Load)
                    const paragraphs = context.document.body.paragraphs;
                    // Phase 1: Load basic properties
                    paragraphs.load("text, styleId, isListItem");
                    await context.sync();

                    const mapLines = [];
                    const lookup = {};
                    const trackedItems = [];
                    
                    // Phase 2: Conditionally load listItem for list paragraphs
                    for (let i = 0; i < paragraphs.items.length; i++) {
                        const p = paragraphs.items[i];
                        if (p.isListItem) {
                            p.listItem.load("level");
                        }
                    }
                    await context.sync();
                    
                    for (let i = 0; i < paragraphs.items.length; i++) {
                        const p = paragraphs.items[i];
                        const id = i + 1;
                        lookup[id] = p;
                        
                        // FIX: Track object to prevent invalidation during sync() in MODIFY actions
                        context.trackedObjects.add(p);
                        trackedItems.push(p);
                        
                        // Truncate for map to save tokens
                        const text = p.text.substring(0, 150).replace(/\n/g, " ");
                        
                        // ENHANCED MAP: Add Style and List Info
                        let meta = `{Style: ${p.styleId}}`;
                        if (p.isListItem) {
                            try {
                                meta += ` {List: Lvl ${p.listItem.level}}`;
                            } catch (e) {
                                // Fallback if listItem not loaded
                                meta += ` {List: true}`;
                            }
                        }
                        
                        if (text.trim().length > 0) {
                            mapLines.push(`[${id}] ${meta} ${text}`);
                        }
                    }
                    
                    // FIX: Sync immediately to register tracked objects with the host
                    console.log(`[Vibe] Tracking ${trackedItems.length} paragraphs...`);
                    await context.sync();
                    
                    const documentMap = mapLines.join("\n");
                    console.log("[Vibe] Map generated:", mapLines.length, "lines");

                    // v7.2: Generate Style Menu
                    const styleMenu = generateStyleMenu(paragraphs.items);
                    console.log("[Vibe v7.2] Style Menu:\n", styleMenu);

                    // 2. Call Router with Style Menu
                    const routerResponse = await callGeminiRouter(apiKey, selectedModel, currentInput, documentMap, styleMenu);
                    console.log("[Vibe] Router Intent:", routerResponse.intent);

                    // 3. Handle Answer
                    if (routerResponse.answer) {
                        setMessages((p) => [...p, { role: "bot", content: routerResponse.answer }]);
                    }

                    // 4. Handle Actions
                    if (routerResponse.actions && routerResponse.actions.length > 0) {
                        // FIX: Sort actions so INSERTs happen before MODIFYs.
                        // This prevents a MODIFY (which replaces a paragraph) from invalidating a reference needed for an INSERT.
                        // Although we have tracking, this is a good optimization.
                        routerResponse.actions.sort((a, b) => (a.type === "INSERT" ? -1 : 1));
                        
                        for (const action of routerResponse.actions) {
                            if (action.type === "MODIFY") {
                                const targetId = action.target_id;
                                const targetP = lookup[targetId];
                                
                                if (targetP) {
                                    targetP.load("text");
                                    const oxmlResult = targetP.getOoxml();
                                    await context.sync();
                                    
                                    const newText = await callGeminiRedline(apiKey, selectedModel, action.instruction, targetP.text);
                                    const result = applyRedlineToOxml(oxmlResult.value, targetP.text, newText);
                                    
                                    if (result.hasChanges) {
                                        targetP.insertOoxml(result.oxml, Word.InsertLocation.replace);
                                        await context.sync();
                                        setMessages((p) => [...p, { role: "bot", content: `✅ Modified section [${targetId}].` }]);
                                    } else {
                                        setMessages((p) => [...p, { role: "bot", content: `⚠️ No changes needed for [${targetId}].` }]);
                                    }
                                } else {
                                    setMessages((p) => [...p, { role: "bot", content: `⚠️ Invalid Target ID: ${targetId}` }]);
                                }
                            } else if (action.type === "INSERT") {
                                const locId = action.location_id;
                                const titleStyleId = action.title_style_id;
                                const bodyStyleId = action.body_style_id || action.style_id;
                                const refP = lookup[locId];
                                
                                // v7.1: Get separate style sources for title and body
                                const titleStyleP = titleStyleId ? lookup[titleStyleId] : null;
                                const bodyStyleP = lookup[bodyStyleId] || refP;
                                
                                // v7.1: Run adjacent clause analysis for verification
                                const clauseContext = analyzeAdjacentClauses(paragraphs.items, locId - 1);
                                console.log("[Vibe v7.1] Adjacent Clause Analysis:", clauseContext);
                                
                                if (refP) {
                                    try {
                                        // Load OXML from style sources
                                        if (titleStyleP) titleStyleP.load("text");
                                        if (bodyStyleP) bodyStyleP.load("text");
                                        
                                        const titleOxmlResult = titleStyleP ? titleStyleP.getOoxml() : null;
                                        const bodyOxmlResult = bodyStyleP.getOoxml();
                                        await context.sync();
                                        
                                        const titleOxml = titleOxmlResult ? titleOxmlResult.value : null;
                                        const bodyOxml = bodyOxmlResult.value;
                                        
                                        // v7.1: Strip markdown from content
                                        const title = action.title ? stripMarkdownFormatting(action.title) : null;
                                        const content = stripMarkdownFormatting(action.content || "");
                                        
                                        // Generate Multi-Paragraph OXML (Title + Body with proper styles)
                                        const newOxml = generateMultiParagraphOxml(titleOxml, bodyOxml, title, content);
                                        
                                        console.log(`[Vibe v7.1] Inserting clause after [${locId}] (Title Style: [${titleStyleId || 'none'}], Body Style: [${bodyStyleId || locId}])`);
                                        
                                        // API Compliance: 2-step insertion
                                        const newP = refP.insertParagraph("", Word.InsertLocation.after);
                                        newP.insertOoxml(newOxml, Word.InsertLocation.replace);
                                        
                                        await context.sync();
                                        
                                        const titleMsg = title ? ` with title "${title.substring(0, 30)}..."` : "";
                                        setMessages((p) => [...p, { role: "bot", content: `✅ Inserted new clause after [${locId}]${titleMsg}` }]);
                                    } catch (e) {
                                        console.warn("[Vibe v7.1] OXML insertion failed. Falling back to plain text.", e);
                                        // Fallback: Plain Text Insertion (strip markdown)
                                        const cleanContent = stripMarkdownFormatting(action.content || "");
                                        if (action.title) {
                                            refP.insertParagraph(stripMarkdownFormatting(action.title), Word.InsertLocation.after);
                                        }
                                        refP.insertParagraph(cleanContent, Word.InsertLocation.after);
                                        await context.sync(); 
                                        setMessages((p) => [...p, { role: "bot", content: `✅ Inserted new clause (plain text) after [${locId}].` }]);
                                    }
                                } else {
                                    setMessages((p) => [...p, { role: "bot", content: `⚠️ Invalid Location ID: ${locId}` }]);
                                }
                            }
                        }
                    }
                    
                    // Cleanup tracked objects
                    if (trackedItems && trackedItems.length > 0) {
                        trackedItems.forEach(p => context.trackedObjects.remove(p));
                        await context.sync();
                    }
                });
            } catch (e) {
                console.error(e);
                setMessages((p) => [...p, { role: "bot", content: "❌ Error: " + e.message }]);
            } finally {
                setIsProcessing(false);
            }
        };

        if (view === "settings") {
            return React.createElement(Settings, { 
                apiKey, 
                setApiKey, 
                selectedModel, 
                setSelectedModel, 
                onBack: () => setView("main") 
            });
        }

        return React.createElement("div", { style: { display: "flex", flexDirection: "column", height: "100vh", background: "#fff" } },
            React.createElement(Header, { onSettingsClick: () => setView("settings") }),
            React.createElement(Chat, { messages: messages }),
            React.createElement(InputArea, { value: inputValue, onChange: setInputValue, onSend: handleAction, disabled: isProcessing })
        );
    };

    // HELPER FUNCTIONS
    function createTextRun(xmlDoc, text, rPr, isDeleted) {
        const r = xmlDoc.createElement("w:r");
        if (rPr) {
            const newRPr = rPr.cloneNode(true);
            r.appendChild(newRPr);
        }
        
        if (isDeleted) {
            const delText = xmlDoc.createElement("w:delText");
            delText.textContent = text;
            delText.setAttribute("xml:space", "preserve");
            r.appendChild(delText);
        } else {
            const t = xmlDoc.createElement("w:t");
            t.textContent = text;
            t.setAttribute("xml:space", "preserve");
            r.appendChild(t);
        }
        return r;
    }

    function createTrackChange(xmlDoc, type, run) {
        const wrapper = xmlDoc.createElement(type === 'del' ? "w:del" : "w:ins");
        wrapper.setAttribute("w:id", Math.floor(Math.random() * 10000).toString());
        wrapper.setAttribute("w:author", VIBE_AUTHOR);
        wrapper.setAttribute("w:date", new Date().toISOString());
        wrapper.appendChild(run);
        return wrapper;
    }

    function hideTables(xmlDoc) {
        const tables = Array.from(xmlDoc.getElementsByTagName("w:tbl"));
        const tableMap = new Map();
        
        tables.forEach((tbl: any, index) => {
            const placeholder = `{{__VIBE_TABLE_${index}__}}`;
            tableMap.set(placeholder, tbl);
            
            // Create placeholder paragraph
            const p = xmlDoc.createElement("w:p");
            const r = xmlDoc.createElement("w:r");
            const t = xmlDoc.createElement("w:t");
            t.textContent = placeholder;
            r.appendChild(t);
            p.appendChild(r);
            
            // Replace table with placeholder
            if (tbl.parentNode) {
                tbl.parentNode.replaceChild(p, tbl);
            }
        });
        
        return tableMap;
    }

    function restoreTables(xmlDoc, tableMap) {
        const paragraphs = Array.from(xmlDoc.getElementsByTagName("w:p"));
        
        paragraphs.forEach((p: any) => {
            const text = p.textContent || "";
            // Check if paragraph is EXACTLY the placeholder (or contains it)
            // We iterate map to find match
            tableMap.forEach((originalTable, placeholder) => {
                if (text.includes(placeholder)) {
                    // Found a placeholder! Replace paragraph with original table.
                    // Note: If the LLM wrapped it in other text, that text is lost. 
                    // We assume LLM preserves placeholder as a distinct block.
                    if (p.parentNode) {
                        p.parentNode.replaceChild(originalTable, p);
                    }
                }
            });
        });
    }

    function extractTextWithStructure(xmlDoc) {
        const paragraphs = Array.from(xmlDoc.getElementsByTagName("w:p"));
        return paragraphs.map((p: any) => {
            return p.textContent || "";
        }).join("\n");
    }

    Office.onReady(() => ReactDOM.render(React.createElement(App), document.getElementById("root")));
  language: typescript
