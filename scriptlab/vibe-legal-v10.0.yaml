        const systemInstruction = "SYSTEM: You are a strict legal editor. Return ONLY the modified legal text based on the instruction. No markdown. No quotes. Do not use LaTeX. Preserve placeholders like [Name].";

        const fullPrompt = `ORIGINAL TEXT: "${originalText}"\n\nINSTRUCTION: ${prompt}`;

        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: `${systemInstruction}\n\n${fullPrompt}` }] }] }),
        });

        if (!response.ok) throw new Error("Gemini Redline Error");
        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || originalText;
