name: Vibe Legal Engine Test
description: Test the Commercial Grade Hybrid Engine with real Word selections
host: WORD
api_set: {}
script:
  content: |
    $("#run").on("click", () => tryCatch(run));

    async function run() {
      await Word.run(async (context) => {
        const selection = context.document.getSelection();
        selection.load("text");
        
        // Get OOXML
        const ooxml = selection.getOoxml();
        await context.sync();
        
        const originalText = selection.text;
        const originalOoxml = ooxml.value;
        
        console.log("=== ORIGINAL TEXT ===");
        console.log(originalText);
        console.log("\n=== ORIGINAL OOXML ===");
        console.log(originalOoxml.substring(0, 2000) + "...");
        
        // Simulate LLM modification
        // Change this to test different scenarios:
        const modifiedText = originalText.replace(/Buyer/g, "Purchaser").replace(/Date/g, "Effective Date");
        
        console.log("\n=== MODIFIED TEXT ===");
        console.log(modifiedText);
        
        // Apply redline using the engine
        const result = applyRedlineToOxml(originalOoxml, originalText, modifiedText);
        
        console.log("\n=== ENGINE RESULT ===");
        console.log("hasChanges:", result.hasChanges);
        console.log("Output OXML (first 2000 chars):", result.oxml.substring(0, 2000) + "...");
        
        if (result.hasChanges) {
          // Insert the redlined OXML
          selection.insertOoxml(result.oxml, Word.InsertLocation.replace);
          await context.sync();
          console.log("\n✅ Redline applied successfully!");
        } else {
          console.log("\n⚠️ No changes to apply");
        }
      });
    }

    // ==========================================
    // COMMERCIAL GRADE HYBRID ENGINE
    // ==========================================
    function applyRedlineToOxml(oxml, originalText, modifiedText) {
      const parser = new DOMParser();
      const serializer = new XMLSerializer();
      
      let xmlDoc;
      try {
        xmlDoc = parser.parseFromString(oxml, "text/xml");
      } catch (e) {
        console.error("Failed to parse OXML:", e);
        return { oxml, hasChanges: false };
      }
      
      const body = xmlDoc.getElementsByTagName("w:body")[0] || xmlDoc.documentElement;
      const allParagraphs = Array.from(xmlDoc.getElementsByTagName("w:p"));
      
      if (allParagraphs.length === 0) {
        return { oxml, hasChanges: false };
      }
      
      // Build structure map
      let fullText = "";
      const structureMap = [];
      const runPropertyMap = [];
      const containerParagraphs = new Map();
      
      allParagraphs.forEach((p, pIndex) => {
        const charStart = fullText.length;
        let container = p.parentNode;
        let containerType = 'other';
        
        if (container.nodeName === "w:tc") containerType = 'cell';
        else if (container.nodeName === "w:body") containerType = 'body';
        
        const pPr = p.getElementsByTagName("w:pPr")[0] || null;
        let numPr = null;
        if (pPr) numPr = pPr.getElementsByTagName("w:numPr")[0] || null;
        
        Array.from(p.childNodes).forEach(child => {
          if (child.nodeName === "w:r") {
            const rPr = child.getElementsByTagName("w:rPr")[0] || null;
            Array.from(child.childNodes).forEach(rc => {
              if (rc.nodeName === "w:t") {
                const text = rc.textContent || "";
                if (text.length > 0) {
                  runPropertyMap.push({
                    charStart: fullText.length,
                    charEnd: fullText.length + text.length,
                    rPr
                  });
                  fullText += text;
                }
              }
            });
          }
        });
        
        if (pIndex < allParagraphs.length - 1) fullText += "\n";
        
        structureMap.push({ charStart, charEnd: fullText.length, paragraph: p, pPr, container, containerType, numPr });
        
        if (!containerParagraphs.has(container)) containerParagraphs.set(container, []);
        containerParagraphs.get(container).push(p);
      });
      
      // No-Op Check
      if (modifiedText.trim() === fullText.trim()) {
        return { oxml, hasChanges: false };
      }
      
      // Diff
      const dmp = new diff_match_patch();
      const diffs = dmp.diff_main(fullText, modifiedText);
      dmp.diff_cleanupSemantic(diffs);
      
      // Reconstruction
      const newParagraphsPerContainer = new Map();
      containerParagraphs.forEach((_, container) => {
        newParagraphsPerContainer.set(container, xmlDoc.createDocumentFragment());
      });
      
      const getStructureAt = (idx) => structureMap.find(s => idx >= s.charStart && idx < s.charEnd) || null;
      const getRunPropsAt = (idx) => {
        const e = runPropertyMap.find(r => idx >= r.charStart && idx < r.charEnd);
        return e ? { rPr: e.rPr } : { rPr: null };
      };
      
      const createParagraph = (pPr, numPr) => {
        const newP = xmlDoc.createElement("w:p");
        if (pPr) {
          const cloned = pPr.cloneNode(true);
          if (numPr && !cloned.getElementsByTagName("w:numPr")[0]) {
            cloned.insertBefore(numPr.cloneNode(true), cloned.firstChild);
          }
          newP.appendChild(cloned);
        } else if (numPr) {
          const newPPr = xmlDoc.createElement("w:pPr");
          newPPr.appendChild(numPr.cloneNode(true));
          newP.appendChild(newPPr);
        }
        return newP;
      };
      
      const wrapTrackChange = (run, type) => {
        const wrapper = xmlDoc.createElement(type === 'ins' ? "w:ins" : "w:del");
        wrapper.setAttribute("w:id", Math.floor(Math.random() * 90000 + 10000).toString());
        wrapper.setAttribute("w:author", "Vibe Legal");
        wrapper.setAttribute("w:date", new Date().toISOString());
        wrapper.appendChild(run);
        return wrapper;
      };
      
      let currentOriginalIndex = 0;
      let currentStructure = getStructureAt(0);
      let currentContainer = currentStructure?.container || body;
      let currentParagraph = createParagraph(currentStructure?.pPr, null);
      
      let fragment = newParagraphsPerContainer.get(currentContainer);
      if (!fragment) {
        fragment = xmlDoc.createDocumentFragment();
        newParagraphsPerContainer.set(currentContainer, fragment);
      }
      fragment.appendChild(currentParagraph);
      
      for (const [op, text] of diffs) {
        const mode = op === 0 ? 'equal' : op === 1 ? 'insert' : 'delete';
        processText(text, mode);
        if (op !== 1) currentOriginalIndex += text.length;
      }
      
      function processText(text, mode) {
        const parts = text.split(/([\n])/);
        let localOffset = 0;
        
        for (const part of parts) {
          if (part === '\n') {
            handleNewline(mode, localOffset);
            localOffset += 1;
          } else if (part.length > 0) {
            handleText(part, mode, localOffset);
            localOffset += part.length;
          }
        }
      }
      
      function handleNewline(mode, offset) {
        if (mode === 'delete') return;
        
        let newStructure = null;
        let inheritNumPr = null;
        
        if (mode === 'equal') {
          const nextIndex = currentOriginalIndex + offset + 1;
          newStructure = getStructureAt(nextIndex);
        } else if (mode === 'insert') {
          const nextStructure = getStructureAt(currentOriginalIndex);
          if (nextStructure && nextStructure.container !== currentStructure?.container) {
            newStructure = nextStructure;
            currentStructure = nextStructure;
          } else {
            newStructure = currentStructure;
            inheritNumPr = currentStructure?.numPr || null;
          }
        }
        
        const targetContainer = newStructure?.container || currentContainer;
        
        if (targetContainer !== currentContainer) {
          currentContainer = targetContainer;
          fragment = newParagraphsPerContainer.get(currentContainer);
          if (!fragment) {
            fragment = xmlDoc.createDocumentFragment();
            newParagraphsPerContainer.set(currentContainer, fragment);
          }
        }
        
        currentParagraph = createParagraph(newStructure?.pPr, mode === 'insert' ? inheritNumPr : null);
        fragment.appendChild(currentParagraph);
        
        if (mode === 'equal') currentStructure = newStructure;
      }
      
      function handleText(text, mode, offset) {
        const propIndex = mode === 'insert' ? (currentOriginalIndex > 0 ? currentOriginalIndex - 1 : 0) : currentOriginalIndex + offset;
        const { rPr } = getRunPropsAt(propIndex);
        
        const run = xmlDoc.createElement("w:r");
        if (rPr) run.appendChild(rPr.cloneNode(true));
        
        const textEl = xmlDoc.createElement(mode === 'delete' ? "w:delText" : "w:t");
        textEl.setAttribute("xml:space", "preserve");
        textEl.textContent = text;
        run.appendChild(textEl);
        
        if (mode === 'insert') {
          currentParagraph.appendChild(wrapTrackChange(run, 'ins'));
        } else if (mode === 'delete') {
          currentParagraph.appendChild(wrapTrackChange(run, 'del'));
        } else {
          currentParagraph.appendChild(run);
        }
      }
      
      // Swap old with new
      containerParagraphs.forEach((oldParagraphs, container) => {
        const newFragment = newParagraphsPerContainer.get(container);
        oldParagraphs.forEach(p => { if (p.parentNode === container) container.removeChild(p); });
        if (newFragment && newFragment.childNodes.length > 0) container.appendChild(newFragment);
      });
      
      return { oxml: serializer.serializeToString(xmlDoc), hasChanges: true };
    }

    async function tryCatch(callback) {
      try {
        await callback();
      } catch (error) {
        console.error(error);
      }
    }
  language: typescript
template:
  content: |
    <h2>Vibe Legal Engine Test</h2>
    <p>Select some text in Word, then click Run to apply a test redline.</p>
    <button id="run">Run</button>
  language: html
style:
  content: |
    body { font-family: 'Segoe UI', sans-serif; padding: 16px; }
    button { padding: 8px 16px; margin-top: 16px; cursor: pointer; }
  language: css
libraries: |
  https://cdnjs.cloudflare.com/ajax/libs/diff-match-patch/1.0.5/index.min.js
