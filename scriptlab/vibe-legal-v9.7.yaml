        const data = await response.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "{}";

        console.log("[Vibe v9.7] Router Raw Response:", text);

        let result = tryParseJSON(text);

        if (!result) {
            console.warn("[Vibe v9.7] Router failed to parse JSON. Returning Fallback.");
