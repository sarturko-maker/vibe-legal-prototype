        • Set target_id to the paragraph ID that contains the text to change.
        • Set instruction to a clear description of the change.
        • The system will handle the redlining automatically.

        RULE 6: HYBRID REQUESTS
        • For broad requests like "make this buyer-friendly", analyze ALL paragraphs.
        • Include MULTIPLE actions: some MODIFY (to change/remove), some INSERT (to add protections).
        • Provide an "answer" field explaining what you're doing.

        =========================================================
        STYLE MENU:
        ${styleMenu}

        DOCUMENT MAP:
        ${documentMap}

        USER PROMPT: ${prompt}`;

        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
