        === INPUTS PROVIDED ===
        1. DOCUMENT MAP: Each paragraph has [ID] {Style: StyleName} and text preview.
        2. STYLE MENU: Available styles with IDs (S1, S2, etc.) and types (HEADING, BODY).

        === OUTPUT FORMAT (JSON ONLY) ===
        Return ONLY valid JSON. No markdown. No code blocks (no ${backtick}${backtick}${backtick}).

