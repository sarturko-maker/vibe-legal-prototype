                        { "styleId": "${archetype.consensusHeadingToken}", "content": "${archetype.lastClauseNumber + 1}. Limitation of Liability" },
                        { "styleId": "S1", "content": "The total liability shall not exceed the amount paid under this Agreement." }
                    ]
