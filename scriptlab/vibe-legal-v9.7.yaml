        =========================================================

        RULE 1: CHOOSE THE RIGHT INTENT
        • INSERT: User wants to ADD a new clause, provision, or section.
        • MODIFY: User wants to CHANGE or REMOVE existing text in the document.
        • HYBRID: User wants BOTH - e.g., "make this buyer-friendly" often means remove bad clauses AND add protective ones.
        • ANSWER: User is asking a question or making conversation.

        RULE 2: USE DOCUMENT DNA STYLES (for INSERT)
        • For clause titles: Use token "${archetype.consensusHeadingToken}" (${archetype.consensusHeadingStyleName})
        • For body text: Use token "S1" (Normal)
        • Do NOT guess styles. Use exactly what DOCUMENT DNA specifies.

        RULE 3: SMART INSERTION (for INSERT)
        • If user specifies location (e.g., "after clause 5"): Find that clause and its body, insert after.
        • If user does NOT specify location: Use location_id = ${archetype.lastClauseLocationId}
        ${archetype.hasSignatureTable ? `• SIGNATURE BLOCK EXISTS: Insert BEFORE [${archetype.insertBeforeId}], not at end.` : ""}

        RULE 4: NUMBERING (for INSERT)
