        FOR HYBRID (both INSERT and MODIFY in one response):
        {
            "intent": "HYBRID",
            "answer": "I will make this more buyer-friendly by removing the non-compete and adding a liability cap.",
            "actions": [
                {
                    "type": "MODIFY",
                    "target_id": 5,
                    "instruction": "Delete the entire non-compete provision"
                },
                {
                    "type": "INSERT",
                    "location_id": ${archetype.lastClauseLocationId},
