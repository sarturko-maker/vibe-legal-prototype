        return result;
    }

    // 7. Robust JSON Parser (The "JSON Shield")
    function tryParseJSON(str: string) {
        if (!str) return null;
        try {
            // 1. Strip Markdown Code Blocks
            let cleanStr = str.replace(/```json\s*|\s*```/g, "").trim();

            // 2. Attempt Direct Parse
            return JSON.parse(cleanStr);
        } catch (e) {
            console.warn("[Vibe v9.7] Direct JSON parse failed. Engaging Shield Protocols...", e);

            try {
                // 3. Extract JSON Payload (Find first '{' and last '}')
                const firstOpen = str.indexOf('{');
                const lastClose = str.lastIndexOf('}');

                if (firstOpen !== -1 && lastClose !== -1 && lastClose > firstOpen) {
                    let candidate = str.substring(firstOpen, lastClose + 1);

                    // 4. Sanitize Keys (Force-quote unquoted keys)
                    // Regex looks for keys that are NOT quoted and followed by a colon
                    // e.g. { key: "val" } -> { "key": "val" }
                    // Note: This is a heuristic and might need further refinement for complex cases
                    candidate = candidate.replace(/([{,]\s*)([a-zA-Z0-9_]+?)\s*:/g, '$1"$2":');

                    // 5. Remove Trailing Commas
                    candidate = candidate.replace(/,\s*}/g, '}').replace(/,\s*]/g, ']');

                    return JSON.parse(candidate);
                }
            } catch (e2) {
                console.error("[Vibe v9.7] JSON Shield failed.", e2);
            }
            return null;
        }
    }

    async function callGeminiRedline(apiKey: string, model: string, prompt: string, originalText: string): Promise<string> {
        const cleanModel = (model || "gemini-2.0-flash-exp").replace(/^models\//, "");
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${cleanModel}:generateContent?key=${apiKey}`;

        const systemInstruction = "SYSTEM: You are a strict legal editor. Return ONLY the modified legal text based on the instruction. No markdown. No quotes. Do not use LaTeX. Preserve placeholders like [Name].";

        const fullPrompt = `ORIGINAL TEXT: "${originalText}"\n\nINSTRUCTION: ${prompt}`;

        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: `${systemInstruction}\n\n${fullPrompt}` }] }] }),
        });

        if (!response.ok) throw new Error("Gemini Redline Error");
        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || originalText;
    }

    // ==========================================
    // V8.0 COMPILER PATTERN (Tag-Based Abstraction)
