name: Vibe Legal Test Harness
description: Test harness for Style Inheritance (V8.1)
host: WORD
api_set: {}
script:
  content: |
    declare var React: any;
    declare var ReactDOM: any;

    // ==========================================
    // SYSTEM UNDER TEST (SUT) - COPIED FROM V8.1
    // ==========================================

    const VIBE_AUTHOR = "Vibe AI";

    interface StyleToken {
        token: string;
        styleId: string;
        styleName: string;
        oxml: string;
    }

    function stripMarkdownFormatting(text: string): string {
        if (!text) return "";
        return text
            .replace(/\*\*(.+?)\*\*/g, "$1")
            .replace(/\*(.+?)\*/g, "$1")
            .replace(/__(.+?)__/g, "$1")
            .replace(/`(.+?)`/g, "$1")
            .replace(/^#+\s*/gm, "")
            .replace(/^[-*]\s+/gm, "")
            .replace(/\n\n+/g, "\n")
            .trim();
    }

    async function generateStyleMenuAndCache(context: Word.RequestContext, paragraphs: Word.ParagraphCollection): Promise<{ styleCache: Map<string, StyleToken>, menu: string }> {
        paragraphs.load("style, styleId");
        await context.sync();
        
        const styleCache = new Map<string, StyleToken>();
        const menuLines = [];
        const seenStyles = new Map<string, { styleName: string, index: number }>();
        
        for (let i = 0; i < paragraphs.items.length; i++) {
            const p = paragraphs.items[i];
            const styleId = p.styleId;
            const styleName = p.style || styleId;
            
            if (!seenStyles.has(styleId) && styleId) {
                seenStyles.set(styleId, { styleName, index: i });
            }
        }
        
        if (!seenStyles.has("Normal")) {
            seenStyles.set("Normal", { styleName: "Normal", index: 0 });
        }

        const styleIds = Array.from(seenStyles.keys());
        const oxmlResults = [];
        
        for (const styleId of styleIds) {
            const info = seenStyles.get(styleId);
            const p = paragraphs.items[info.index];
            if (p) {
                oxmlResults.push(p.getOoxml());
            } else {
                oxmlResults.push({ value: "" }); 
            }
        }
        
        await context.sync();
        
        let tokenCount = 1;
        
        for (let i = 0; i < styleIds.length; i++) {
            const styleId = styleIds[i];
            const info = seenStyles.get(styleId);
            const oxml = oxmlResults[i].value;
            const token = `S${tokenCount++}`;
            
            styleCache.set(token, {
                token,
                styleId: styleId,
                styleName: info.styleName,
                oxml
            });
            
            let category = "BODY";
            const sLower = styleId.toLowerCase();
            if (sLower.includes("heading") || sLower.includes("title")) category = "HEADING";
            else if (sLower.includes("list") || sLower.includes("number")) category = "LIST";
            
            let sample = "Sample text";
            const p = paragraphs.items[info.index];
            try { sample = (p.text || "").substring(0, 30).replace(/\n/g, " "); } catch (e) {}
            
            menuLines.push(`{ "id": "${token}", "name": "${info.styleName}", "type": "${category}", "sample": "${sample}" }`);
        }
        
        return { styleCache, menu: menuLines.join("\n") };
    }

    function cleanOxmlForInjection(oxml: string): string {
        return oxml
            .replace(/<w:sectPr>[\s\S]*?<\/w:sectPr>/g, "")
            .replace(/<w:numPr>[\s\S]*?<\/w:numPr>/g, "");
    }

    async function insertBlocks(context: Word.RequestContext, blocks: any[], styleCache: Map<string, StyleToken>, insertLocation: Word.Paragraph) {
        let lastInsert = insertLocation;
        let insertedCount = 0;
        
        const parser = new DOMParser();
        const serializer = new XMLSerializer();
        const WORD_NS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
        
        for (const block of blocks) {
            const styleToken = block.styleId;
            const content = block.content;
            
            if (!content) continue;

            const tokenData = styleCache.get(styleToken);
            
            if (!tokenData || !tokenData.oxml) {
                const p = lastInsert.insertParagraph(stripMarkdownFormatting(content), "After");
                if (tokenData) p.style = tokenData.styleId;
                lastInsert = p;
                await context.sync();
                insertedCount++;
                continue;
            }
            
            try {
                const cleanOxml = cleanOxmlForInjection(tokenData.oxml);
                const xmlDoc = parser.parseFromString(cleanOxml, "text/xml");
                
                const pNode = xmlDoc.getElementsByTagNameNS(WORD_NS, "p")[0] || xmlDoc.getElementsByTagName("w:p")[0];
                
                if (!pNode) throw new Error("No <w:p> found in cached OXML");

                const children = Array.from(pNode.childNodes);
                let pPrNode = null;
                let rPrNode = null;

                for (const child of children) {
                    const name = child.nodeName;
                    const local = child.localName;

                    if (name === "w:pPr" || local === "pPr") {
                        pPrNode = child;
                    } else if ((name === "w:r" || local === "r") && !rPrNode) {
                        const runChildren = Array.from(child.childNodes);
                        for (const rc of runChildren) {
                            const rcName = rc.nodeName;
                            const rcLocal = rc.localName;
                            if (rcName === "w:rPr" || rcLocal === "rPr") {
                                rPrNode = rc.cloneNode(true);
                                break;
                            }
                        }
                    }
                    
                    if (name !== "w:pPr" && local !== "pPr") {
                        pNode.removeChild(child);
                    }
                }

                const cleanContent = stripMarkdownFormatting(content);
                const insId = Math.floor(Math.random() * 10000000).toString();
                const date = new Date().toISOString();
                
                const insNode = xmlDoc.createElementNS(WORD_NS, "w:ins");
                insNode.setAttribute("w:id", insId);
                insNode.setAttribute("w:author", VIBE_AUTHOR);
                insNode.setAttribute("w:date", date);
                
                const runNode = xmlDoc.createElementNS(WORD_NS, "w:r");
                if (rPrNode) runNode.appendChild(rPrNode);
                
                const textNode = xmlDoc.createElementNS(WORD_NS, "w:t");
                textNode.setAttribute("xml:space", "preserve");
                textNode.textContent = cleanContent;
                
                runNode.appendChild(textNode);
                insNode.appendChild(runNode);
                pNode.appendChild(insNode);

                const finalOxml = serializer.serializeToString(xmlDoc);
                
                const newP = lastInsert.insertParagraph("", "After");
                newP.insertOoxml(finalOxml, "Replace");
                
                newP.style = tokenData.styleId;
                
                lastInsert = newP;
                insertedCount++;
                
                if (insertedCount % 3 === 0) await context.sync();

            } catch (e) {
                console.error(`[Vibe v8.1] OXML DOM Error for ${styleToken}:`, e);
                const p = lastInsert.insertParagraph(stripMarkdownFormatting(content), "After");
                if (tokenData) p.style = tokenData.styleId;
                lastInsert = p;
                await context.sync();
            }
        }
        
        await context.sync();
    }

    // ==========================================
    // TEST RUNNER
    // ==========================================

    interface TestResult {
        name: string;
        status: "PASS" | "FAIL" | "ERROR";
        message?: string;
        details?: any;
    }

    const TestRunner = () => {
        const [results, setResults] = React.useState<TestResult[]>([]);
        const [isRunning, setIsRunning] = React.useState(false);

        const logResult = (result: TestResult) => {
            setResults(prev => [...prev, result]);
        };

        const runAllTests = async () => {
            setIsRunning(true);
            setResults([]);
            
            try {
                await runUnitTests(logResult);
                await runIntegrationTests(logResult);
                await runDiagnosticTests(logResult);
            } catch (e) {
                logResult({ name: "Global Error", status: "ERROR", message: e.message });
            } finally {
                setIsRunning(false);
            }
        };

        return React.createElement("div", { style: { padding: "20px", fontFamily: "sans-serif" } },
            React.createElement("h1", null, "Vibe Legal Test Harness"),
            React.createElement("button", { 
                onClick: runAllTests, 
                disabled: isRunning,
                style: { padding: "10px 20px", fontSize: "16px", cursor: "pointer", background: "#0078d4", color: "white", border: "none", borderRadius: "4px" }
            }, isRunning ? "Running..." : "Run All Tests"),
            React.createElement("div", { style: { marginTop: "20px" } },
                results.map((r, i) => 
                    React.createElement("div", { key: i, style: { 
                        padding: "10px", 
                        marginBottom: "10px", 
                        borderLeft: `5px solid ${r.status === "PASS" ? "green" : "red"}`,
                        background: "#f0f0f0" 
                    } },
                        React.createElement("strong", null, `[${r.status}] ${r.name}`),
                        r.message && React.createElement("div", { style: { marginTop: "5px", color: "#666" } }, r.message),
                        r.details && React.createElement("pre", { style: { fontSize: "11px", overflow: "auto" } }, JSON.stringify(r.details, null, 2))
                    )
                )
            )
        );
    };

    // ==========================================
    // UNIT TESTS
    // ==========================================

    async function runUnitTests(log: (r: TestResult) => void) {
        log({ name: "--- UNIT TESTS ---", status: "PASS", message: "Starting Unit Tests" });

        // TEST 1: Style Menu Generation (Requires Word Context)
        await Word.run(async (context) => {
            try {
                const paragraphs = context.document.body.paragraphs;
                const { styleCache, menu } = await generateStyleMenuAndCache(context, paragraphs);
                
                if (styleCache.size > 0 && menu.length > 0) {
                    log({ name: "Unit 1: Style Menu Generation", status: "PASS", message: `Found ${styleCache.size} styles` });
                } else {
                    log({ name: "Unit 1: Style Menu Generation", status: "FAIL", message: "No styles found or menu empty" });
                }
            } catch (e) {
                log({ name: "Unit 1: Style Menu Generation", status: "ERROR", message: e.message });
            }
        });

        // TEST 2: OXML Cleaning
        try {
            const rawOxml = '<w:p><w:pPr><w:sectPr>...</w:sectPr><w:numPr>...</w:numPr></w:pPr></w:p>';
            const cleaned = cleanOxmlForInjection(rawOxml);
            if (!cleaned.includes("sectPr") && !cleaned.includes("numPr")) {
                log({ name: "Unit 2: OXML Cleaning", status: "PASS", message: "Stripped sectPr and numPr" });
            } else {
                log({ name: "Unit 2: OXML Cleaning", status: "FAIL", message: "Failed to strip tags", details: { cleaned } });
            }
        } catch (e) {
            log({ name: "Unit 2: OXML Cleaning", status: "ERROR", message: e.message });
        }

        // TEST 3: DOM Manipulation - pPr Preservation
        try {
            const parser = new DOMParser();
            const oxml = '<w:p xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:pPr><w:spacing w:after="200"/></w:pPr><w:r><w:t>Old</w:t></w:r></w:p>';
            const doc = parser.parseFromString(oxml, "text/xml");
            const pPr = doc.getElementsByTagName("w:pPr")[0];
            if (pPr && pPr.getAttribute("w:after") !== "0") { // Mock check
                 log({ name: "Unit 3: DOM pPr Preservation", status: "PASS", message: "pPr accessible in DOM" });
            } else {
                 log({ name: "Unit 3: DOM pPr Preservation", status: "FAIL" });
            }
        } catch (e) {
            log({ name: "Unit 3: DOM pPr Preservation", status: "ERROR", message: e.message });
        }

        // TEST 4: DOM Manipulation - rPr Preservation
        try {
            const parser = new DOMParser();
            const oxml = '<w:p xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:r><w:rPr><w:b/></w:rPr><w:t>Bold</w:t></w:r></w:p>';
            const doc = parser.parseFromString(oxml, "text/xml");
            const rPr = doc.getElementsByTagName("w:rPr")[0];
            if (rPr) {
                 log({ name: "Unit 4: DOM rPr Preservation", status: "PASS", message: "rPr found" });
            } else {
                 log({ name: "Unit 4: DOM rPr Preservation", status: "FAIL" });
            }
        } catch (e) {
            log({ name: "Unit 4: DOM rPr Preservation", status: "ERROR", message: e.message });
        }

        // TEST 5: Track Change Wrapper
        try {
            const parser = new DOMParser();
            const doc = parser.parseFromString('<root xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"/>', "text/xml");
            const ins = doc.createElementNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main", "w:ins");
            if (ins.tagName === "w:ins" || ins.tagName === "ins") {
                log({ name: "Unit 5: Track Change Wrapper", status: "PASS", message: "Created w:ins element" });
            } else {
                log({ name: "Unit 5: Track Change Wrapper", status: "FAIL", details: { tagName: ins.tagName } });
            }
        } catch (e) {
            log({ name: "Unit 5: Track Change Wrapper", status: "ERROR", message: e.message });
        }

        // TEST 6: Namespace Handling
        try {
            const parser = new DOMParser();
            // Intentionally use a tricky OXML without explicit namespace on root if possible, or mixed
            const oxml = '<w:p xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:pPr/></w:p>';
            const doc = parser.parseFromString(oxml, "text/xml");
            const p = doc.getElementsByTagNameNS("http://schemas.openxmlformats.org/wordprocessingml/2006/main", "p")[0];
            if (p) {
                log({ name: "Unit 6: Namespace Handling", status: "PASS", message: "Correctly handled NS" });
            } else {
                log({ name: "Unit 6: Namespace Handling", status: "FAIL", message: "Could not find element by NS" });
            }
        } catch (e) {
            log({ name: "Unit 6: Namespace Handling", status: "ERROR", message: e.message });
        }
    }

    // ==========================================
    // INTEGRATION TESTS
    // ==========================================

    async function runIntegrationTests(log: (r: TestResult) => void) {
        log({ name: "--- INTEGRATION TESTS ---", status: "PASS", message: "Starting Integration Tests" });

        await Word.run(async (context) => {
            // Setup: Get styles
            const paragraphs = context.document.body.paragraphs;
            const { styleCache } = await generateStyleMenuAndCache(context, paragraphs);
            
            // Find a Heading style
            let headingToken = null;
            for (const [token, data] of styleCache) {
                if (data.styleId.toLowerCase().includes("heading")) {
                    headingToken = token;
                    break;
                }
            }

            if (!headingToken) {
                log({ name: "Setup", status: "ERROR", message: "No Heading style found in document. Please add one." });
                return;
            }

            // TEST A: Insert Single Heading
            try {
                const blocks = [{ styleId: headingToken, content: "TEST A: INSERTED HEADING" }];
                const lastP = context.document.body.paragraphs.getLast();
                await insertBlocks(context, blocks, styleCache, lastP);
                
                // Verify
                const newP = context.document.body.paragraphs.getLast();
                newP.load("styleId, text");
                await context.sync();
                
                if (newP.text.includes("TEST A") && newP.styleId === styleCache.get(headingToken).styleId) {
                    log({ name: "Integration A: Insert Single Heading", status: "PASS", details: { style: newP.styleId } });
                } else {
                    log({ name: "Integration A: Insert Single Heading", status: "FAIL", details: { expected: styleCache.get(headingToken).styleId, actual: newP.styleId } });
                }
            } catch (e) {
                log({ name: "Integration A: Insert Single Heading", status: "ERROR", message: e.message });
            }

            // TEST B: Insert Multiple Blocks
            try {
                const normalToken = Array.from(styleCache.keys()).find(k => styleCache.get(k).styleId === "Normal") || headingToken;
                const blocks = [
                    { styleId: headingToken, content: "TEST B: HEADING" },
                    { styleId: normalToken, content: "TEST B: BODY" }
                ];
                const lastP = context.document.body.paragraphs.getLast();
                await insertBlocks(context, blocks, styleCache, lastP);
                
                log({ name: "Integration B: Insert Multiple Blocks", status: "PASS", message: "Executed without error (Visual check required)" });
            } catch (e) {
                log({ name: "Integration B: Insert Multiple Blocks", status: "ERROR", message: e.message });
            }

            // TEST C: Insert After Table
            log({ name: "Integration C: Insert After Table", status: "PASS", message: "Manual check required: Place cursor after table and run." });

            // TEST D: Track Changes
            log({ name: "Integration D: Track Changes", status: "PASS", message: "Visual check: Green underline present?" });
        });
    }

    // ==========================================
    // DIAGNOSTIC TESTS (PHASE 2)
    // ==========================================

    async function runDiagnosticTests(log: (r: TestResult) => void) {
        log({ name: "--- DIAGNOSTIC TESTS ---", status: "PASS", message: "Starting Diagnostic Tests" });

        // Test: OXML Cache Content Inspection
        await Word.run(async (context) => {
            const paragraphs = context.document.body.paragraphs;
            const { styleCache } = await generateStyleMenuAndCache(context, paragraphs);
            
            for (const [token, data] of styleCache) {
                const hasPStyle = data.oxml.includes("<w:pStyle");
                const hasPPr = data.oxml.includes("<w:pPr");
                const hasRPr = data.oxml.includes("<w:rPr");
                const pStyleMatch = data.oxml.match(/<w:pStyle[^>]*w:val="([^"]+)"/);
                
                log({
                    name: `Diag: OXML Inspection ${token}`,
                    status: hasPStyle ? "PASS" : "FAIL",
                    details: {
                        hasPPr,
                        hasRPr,
                        hasPStyle,
                        pStyleValue: pStyleMatch ? pStyleMatch[1] : "NOT FOUND",
                        oxmlLength: data.oxml.length,
                        oxmlPreview: data.oxml.substring(0, 100) + "..."
                    }
                });
            }
        });

        // Test: DOM Parse Verification
        await Word.run(async (context) => {
            const paragraphs = context.document.body.paragraphs;
            const { styleCache } = await generateStyleMenuAndCache(context, paragraphs);
            
            const parser = new DOMParser();
            const WORD_NS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
            
            for (const [token, data] of styleCache) {
                try {
                    const doc = parser.parseFromString(data.oxml, "text/xml");
                    
                    const parseError = doc.querySelector("parsererror");
                    if (parseError) {
                        log({ name: `Diag: DOM Parse ${token}`, status: "FAIL", message: "Parse error", details: parseError.textContent });
                        continue;
                    }
                    
                    const pByNS = doc.getElementsByTagNameNS(WORD_NS, "p")[0];
                    const pByTag = doc.getElementsByTagName("w:p")[0];
                    const pNode = pByNS || pByTag;
                    
                    if (!pNode) {
                        log({ name: `Diag: DOM Parse ${token}`, status: "FAIL", message: "No <w:p> found" });
                        continue;
                    }
                    
                    const pPr = pNode.getElementsByTagName("w:pPr")[0] || pNode.getElementsByTagNameNS(WORD_NS, "pPr")[0];
                    let pStyle = null;
                    if (pPr) {
                        pStyle = pPr.getElementsByTagName("w:pStyle")[0] || pPr.getElementsByTagNameNS(WORD_NS, "pStyle")[0];
                    }
                    
                    log({
                        name: `Diag: DOM Parse ${token}`,
                        status: pPr && pStyle ? "PASS" : "FAIL",
                        details: {
                            foundP: !!pNode,
                            foundPPr: !!pPr,
                            foundPStyle: !!pStyle,
                            pStyleVal: pStyle ? pStyle.getAttribute("w:val") : null
                        }
                    });
                    
                } catch (e) {
                    log({ name: `Diag: DOM Parse ${token}`, status: "ERROR", message: e.message });
                }
            }
        });

        // Test: Serialization Round-Trip
        await Word.run(async (context) => {
            const paragraphs = context.document.body.paragraphs;
            const { styleCache } = await generateStyleMenuAndCache(context, paragraphs);
            
            const parser = new DOMParser();
            const serializer = new XMLSerializer();
            const WORD_NS = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
            
            for (const [token, data] of styleCache) {
                try {
                    const doc = parser.parseFromString(data.oxml, "text/xml");
                    const pNode = doc.getElementsByTagNameNS(WORD_NS, "p")[0] || doc.getElementsByTagName("w:p")[0];
                    
                    if (!pNode) continue;
                    
                    const serialized = serializer.serializeToString(doc);
                    const originalHasPStyle = data.oxml.includes("<w:pStyle");
                    const serializedHasPStyle = serialized.includes("<w:pStyle") || serialized.includes(":pStyle");
                    
                    log({
                        name: `Diag: Serialization ${token}`,
                        status: originalHasPStyle === serializedHasPStyle ? "PASS" : "FAIL",
                        details: {
                            originalHasPStyle,
                            serializedHasPStyle,
                            diff: serialized.length - data.oxml.length
                        }
                    });
                    
                } catch (e) {
                    log({ name: `Diag: Serialization ${token}`, status: "ERROR", message: e.message });
                }
            }
        });

        // Test: removeChild Loop Safety
        try {
            const parser = new DOMParser();
            const xml = `<p xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
                <pPr><pStyle val="Heading1"/></pPr>
                <r><t>Text1</t></r>
                <r><t>Text2</t></r>
            </p>`;
            
            const doc = parser.parseFromString(xml, "text/xml");
            const p = doc.documentElement;
            
            const children = Array.from(p.childNodes);
            let pPrSurvived = false;
            
            for (const child of children) {
                const name = child.nodeName;
                if (name !== "pPr") {
                    p.removeChild(child);
                } else {
                    pPrSurvived = true;
                }
            }
            
            const remainingChildren = p.childNodes.length;
            
            log({
                name: "Diag: removeChild Loop Safety",
                status: pPrSurvived && remainingChildren === 1 ? "PASS" : "FAIL",
                details: { pPrSurvived, remainingChildren }
            });
        } catch (e) {
            log({ name: "Diag: removeChild Loop Safety", status: "ERROR", message: e.message });
        }

        // Test: Insert OXML Acceptance
        await Word.run(async (context) => {
            const minimalOxml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <pkg:package xmlns:pkg="http://schemas.microsoft.com/office/2006/xmlPackage">
      <pkg:part pkg:name="/word/document.xml" pkg:contentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml">
        <pkg:xmlData>
          <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
            <w:body>
              <w:p>
                <w:pPr>
                  <w:pStyle w:val="Heading1"/>
                </w:pPr>
                <w:ins w:id="1" w:author="Test" w:date="2024-01-01T00:00:00Z">
                  <w:r>
                    <w:t>TEST OXML HEADING</w:t>
                  </w:r>
                </w:ins>
              </w:p>
            </w:body>
          </w:document>
        </pkg:xmlData>
      </pkg:part>
    </pkg:package>`;

            try {
                const lastP = context.document.body.paragraphs.getLast();
                const newP = lastP.insertParagraph("", "After");
                newP.insertOoxml(minimalOxml, "Replace");
                await context.sync();
                
                newP.load("styleId, text");
                await context.sync();
                
                log({
                    name: "Diag: OXML Acceptance",
                    status: newP.styleId === "Heading1" ? "PASS" : "FAIL",
                    details: { expected: "Heading1", actual: newP.styleId }
                });
            } catch (e) {
                log({ name: "Diag: OXML Acceptance", status: "ERROR", message: e.message });
            }
        });

        // Test: Style API vs OXML Conflict
        await Word.run(async (context) => {
            const normalOxml = `<?xml version="1.0"?>
    <pkg:package xmlns:pkg="http://schemas.microsoft.com/office/2006/xmlPackage">
      <pkg:part pkg:name="/word/document.xml" pkg:contentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml">
        <pkg:xmlData>
          <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
            <w:body>
              <w:p>
                <w:pPr><w:pStyle w:val="Normal"/></w:pPr>
                <w:r><w:t>API Override Test</w:t></w:r>
              </w:p>
            </w:body>
          </w:document>
        </pkg:xmlData>
      </pkg:part>
    </pkg:package>`;

            try {
                const lastP = context.document.body.paragraphs.getLast();
                const newP = lastP.insertParagraph("", "After");
                newP.insertOoxml(normalOxml, "Replace");
                await context.sync();
                
                newP.style = "Heading 1";
                await context.sync();
                
                newP.load("styleId");
                await context.sync();
                
                log({
                    name: "Diag: Style API Override",
                    status: newP.styleId === "Heading1" ? "PASS" : "FAIL",
                    message: "API style setting " + (newP.styleId === "Heading1" ? "wins over" : "loses to") + " OXML",
                    details: { finalStyle: newP.styleId }
                });
            } catch (e) {
                log({ name: "Diag: Style API Override", status: "ERROR", message: e.message });
            }
        });
    }

    Office.onReady(() => {
        const container = document.getElementById('container');
        if (container) {
            const root = ReactDOM.createRoot(container);
            root.render(React.createElement(TestRunner));
        } else {
            console.error("Error: 'container' element not found in DOM.");
        }
    });
  language: typescript
