name: Vibe Legal V5.1
description: Commercial Grade OXML Redline Engine with Hybrid Mode
host: WORD
api_set: {}
script:
  content: |
    declare var diff_match_patch: any;
    declare var React: any;
    declare var ReactDOM: any;

    // ==========================================
    // V5.1 HYBRID MODE ENGINE
    // ==========================================

    interface TextSpan {
        charStart: number;
        charEnd: number;
        textElement: Element;
        runElement: Element;
        paragraph: Element;
        container: Element;
        rPr: Element | null;
    }

    interface StructureEntry {
        charStart: number;
        charEnd: number;
        paragraph: Element;
        pPr: Element | null;
        container: Element;
        numPr: Element | null;
    }

    function applyRedlineToOxml(
        oxml: string,
        originalText: string,
        modifiedText: string
    ): { oxml: string; hasChanges: boolean } {
        const parser = new DOMParser();
        const serializer = new XMLSerializer();
        
        let xmlDoc;
        try {
            xmlDoc = parser.parseFromString(oxml, "text/xml");
        } catch (e) {
            console.error("[Engine] Failed to parse OXML:", e);
            return { oxml, hasChanges: false };
        }

        const cleanModifiedText = sanitizeAiResponse(modifiedText);
        
        if (cleanModifiedText.trim() === originalText.trim()) {
            return { oxml, hasChanges: false };
        }

        // Check for tables
        const tables = xmlDoc.getElementsByTagName("w:tbl");
        const hasTables = tables.length > 0;

        if (hasTables) {
            return applySurgicalMode(xmlDoc, originalText, cleanModifiedText, serializer);
        } else {
            return applyReconstructionMode(xmlDoc, originalText, cleanModifiedText, serializer);
        }
    }

    // SURGICAL MODE (for tables - preserves structure)
    function applySurgicalMode(xmlDoc, originalText, modifiedText, serializer) {
        let fullText = "";
        const textSpans: TextSpan[] = [];
        
        const allParagraphs = Array.from(xmlDoc.getElementsByTagName("w:p"));
        
        allParagraphs.forEach((p: Element, pIndex) => {
            const container = p.parentNode as Element;
            
            Array.from(p.childNodes).forEach(child => {
                if (child.nodeName === "w:r") {
                    const r = child as Element;
                    const rPr = r.getElementsByTagName("w:rPr")[0] || null;
                    Array.from(r.childNodes).forEach(rc => {
                        if (rc.nodeName === "w:t") {
                            const t = rc as Element;
                            const text = t.textContent || "";
                            if (text.length > 0) {
                                textSpans.push({ charStart: fullText.length, charEnd: fullText.length + text.length, textElement: t, runElement: r, paragraph: p, container, rPr });
                                fullText += text;
                            }
                        }
                    });
                } else if (child.nodeName === "w:hyperlink") {
                    Array.from(child.childNodes).forEach(hc => {
                        if (hc.nodeName === "w:r") {
                            const r = hc as Element;
                            const rPr = r.getElementsByTagName("w:rPr")[0] || null;
                            Array.from(r.childNodes).forEach(rc => {
                                if (rc.nodeName === "w:t") {
                                    const t = rc as Element;
                                    const text = t.textContent || "";
                                    if (text.length > 0) {
                                        textSpans.push({ charStart: fullText.length, charEnd: fullText.length + text.length, textElement: t, runElement: r, paragraph: p, container, rPr });
                                        fullText += text;
                                    }
                                }
                            });
                        }
                    });
                }
            });
            if (pIndex < allParagraphs.length - 1) fullText += "\n";
        });

        const dmp = new diff_match_patch();
        const diffs = dmp.diff_main(fullText, modifiedText);
        dmp.diff_cleanupSemantic(diffs);

        let currentPos = 0;
        const processedSpans = new Set();
        
        for (const diff of diffs) {
            const [op, text] = diff;
            if (op === 0) {
                currentPos += text.length;
            } else if (op === -1) {
                processDelete(xmlDoc, textSpans, currentPos, currentPos + text.length, processedSpans);
                currentPos += text.length;
            } else if (op === 1) {
                const textWithoutNewlines = text.replace(/\n/g, ' ');
                if (textWithoutNewlines.trim().length > 0) {
                    processInsert(xmlDoc, textSpans, currentPos, textWithoutNewlines, processedSpans);
                }
            }
        }

        return { oxml: serializer.serializeToString(xmlDoc), hasChanges: true };
    }

    function processDelete(xmlDoc, textSpans, startPos, endPos, processedSpans) {
        const affectedSpans = textSpans.filter(s => s.charEnd > startPos && s.charStart < endPos);
        
        for (const span of affectedSpans) {
            if (processedSpans.has(span.textElement)) continue;
            
            const deleteStart = Math.max(0, startPos - span.charStart);
            const deleteEnd = Math.min(span.charEnd - span.charStart, endPos - span.charStart);
            
            const originalText = span.textElement.textContent || "";
            const beforeText = originalText.substring(0, deleteStart);
            const deletedText = originalText.substring(deleteStart, deleteEnd);
            const afterText = originalText.substring(deleteEnd);
            
            if (deletedText.length === 0) continue;
            
            const parent = span.runElement.parentNode;
            if (!parent) continue;
            
            if (beforeText.length === 0 && afterText.length === 0) {
                const delRun = createTextRun(xmlDoc, deletedText, span.rPr, true);
                const delWrapper = createTrackChange(xmlDoc, 'del', delRun);
                parent.insertBefore(delWrapper, span.runElement);
                parent.removeChild(span.runElement);
            } else {
                if (beforeText.length > 0) {
                    const beforeRun = createTextRun(xmlDoc, beforeText, span.rPr, false);
                    parent.insertBefore(beforeRun, span.runElement);
                }
                const delRun = createTextRun(xmlDoc, deletedText, span.rPr, true);
                const delWrapper = createTrackChange(xmlDoc, 'del', delRun);
                parent.insertBefore(delWrapper, span.runElement);
                if (afterText.length > 0) {
                    const afterRun = createTextRun(xmlDoc, afterText, span.rPr, false);
                    parent.insertBefore(afterRun, span.runElement);
                }
                parent.removeChild(span.runElement);
            }
            processedSpans.add(span.textElement);
        }
    }

    function processInsert(xmlDoc, textSpans, pos, text, processedSpans) {
        // Try to find the span at the insertion position
        let targetSpan = textSpans.find(s => pos >= s.charStart && pos < s.charEnd);
        
        // If not found, try the span that ends at this position
        if (!targetSpan && pos > 0) {
            targetSpan = textSpans.find(s => pos === s.charEnd);
        }
        
        // If still not found, try the span just before
        if (!targetSpan && pos > 0) {
            targetSpan = textSpans.find(s => s.charEnd <= pos);
            if (!targetSpan && textSpans.length > 0) {
                // Find the closest span before this position
                const before = textSpans.filter(s => s.charEnd <= pos);
                if (before.length > 0) {
                    targetSpan = before[before.length - 1];
                }
            }
        }
        
        // Last resort: use the last span
        if (!targetSpan && textSpans.length > 0) {
            targetSpan = textSpans[textSpans.length - 1];
        }
        
        if (targetSpan) {
            // CRITICAL: Ensure we inherit the rPr for formatting preservation
            const rPr = targetSpan.rPr;
            const insRun = createTextRun(xmlDoc, text, rPr, false);
            const insWrapper = createTrackChange(xmlDoc, 'ins', insRun);
            const parent = targetSpan.runElement.parentNode;
            if (parent) parent.insertBefore(insWrapper, targetSpan.runElement.nextSibling);
        }
    }

    // RECONSTRUCTION MODE (Restored from Legacy Vibe 3.3 Stable)
    function applyReconstructionMode(xmlDoc, originalText, modifiedText, serializer) {
        // 1. EXTRACT PARAGRAPHS
        const body = xmlDoc.getElementsByTagName("w:body")[0] || xmlDoc.documentElement;
        const paragraphs = Array.from(xmlDoc.getElementsByTagName("w:p"));

        if (paragraphs.length === 0) return { oxml: serializer.serializeToString(xmlDoc), hasChanges: false };

        // 2. BUILD CONTEXT & MAPS
        let originalFullText = "";
        const propertyMap = [];
        const paragraphMap = [];
        const sentinelMap = [];
        const referenceMap = new Map();
        const tokenToCharMap = new Map();
        let nextCharCode = 0xe000;

        const uniqueContainers = new Set();
        const replacementContainers = new Map();

        paragraphs.forEach((p, pIndex) => {
            const pStart = originalFullText.length;
            const children = Array.from(p.childNodes);

            children.forEach((child) => {
                if (child.nodeName === "w:r") {
                    const r = child;
                    const rPr = r.getElementsByTagName("w:rPr")[0] || null;
                    const runChildren = Array.from(r.childNodes);

                    runChildren.forEach((rc) => {
                        if (rc.nodeName === "w:t") {
                            const textContent = rc.textContent || "";
                            if (textContent.length > 0) {
                                propertyMap.push({
                                    start: originalFullText.length,
                                    end: originalFullText.length + textContent.length,
                                    rPr: rPr,
                                });
                                originalFullText += textContent;
                            }
                        } else if (["w:drawing", "w:pict", "w:object", "w:fldChar", "w:instrText"].includes(rc.nodeName)) {
                            // SENTINEL LOGIC
                            const rcElement = rc;
                            const txbxContent = rcElement.getElementsByTagName("w:txbxContent")[0];
                            const hasTextBox = rc.nodeName === "w:pict" && !!txbxContent;

                            if (hasTextBox) {
                                sentinelMap.push({
                                    start: originalFullText.length,
                                    node: rc,
                                    isTextBox: true,
                                    originalContainer: txbxContent,
                                });
                                originalFullText += "\uFFFC";
                                propertyMap.push({ start: originalFullText.length - 1, end: originalFullText.length, rPr: rPr });
                            } else {
                                sentinelMap.push({ start: originalFullText.length, node: rc });
                                originalFullText += "\uFFFC";
                                propertyMap.push({ start: originalFullText.length - 1, end: originalFullText.length, rPr: rPr });
                            }
                        } else if (rc.nodeName === "w:footnoteReference" || rc.nodeName === "w:endnoteReference") {
                            // REFERENCE LOGIC
                            const ref = rc;
                            const id = ref.getAttribute("w:id");
                            if (id) {
                                const type = rc.nodeName === "w:footnoteReference" ? "FN" : "EN";
                                const tokenString = `{{__${type}_${id}__}}`;
                                const char = String.fromCharCode(nextCharCode++);
                                referenceMap.set(char, rc);
                                tokenToCharMap.set(tokenString, char);
                                originalFullText += char;
                                propertyMap.push({ start: originalFullText.length - 1, end: originalFullText.length, rPr: rPr });
                            }
                        }
                    });
                } else if (child.nodeName === "w:hyperlink") {
                    const h = child;
                    const hChildren = Array.from(h.childNodes);
                    hChildren.forEach((hc) => {
                        if (hc.nodeName === "w:r") {
                            const r = hc;
                            const rPr = r.getElementsByTagName("w:rPr")[0] || null;
                            const texts = Array.from(r.getElementsByTagName("w:t"));
                            texts.forEach((t) => {
                                const textContent = t.textContent || "";
                                if (textContent.length > 0) {
                                    propertyMap.push({
                                        start: originalFullText.length,
                                        end: originalFullText.length + textContent.length,
                                        rPr: rPr,
                                        wrapper: h,
                                    });
                                    originalFullText += textContent;
                                }
                            });
                        }
                    });
                } else if (["w:sdt", "w:oMath", "m:oMath", "w:bookmarkStart", "w:bookmarkEnd"].includes(child.nodeName)) {
                    sentinelMap.push({ start: originalFullText.length, node: child });
                    originalFullText += "\uFFFC";
                }
            });

            if (pIndex < paragraphs.length - 1) {
                originalFullText += "\n";
            }

            const pEnd = originalFullText.length;
            const pPr = p.getElementsByTagName("w:pPr")[0] || null;
            const container = p.parentNode;
            if (container) uniqueContainers.add(container);

            paragraphMap.push({
                start: pStart,
                end: pEnd,
                pPr: pPr,
                container: container || body,
            });
        });

        // 3. SANITIZE & PROCESS INPUT
        // Note: modifiedText passed in is already sanitized by the wrapper, but legacy logic re-sanitizes.
        // We'll trust the wrapper's sanitization but apply the token replacement.
        let processedModifiedText = modifiedText || ""; // Fix: Ensure not null

        tokenToCharMap.forEach((char, tokenString) => {
            const escapedToken = tokenString.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, "\\$&");
            processedModifiedText = processedModifiedText.replace(new RegExp(escapedToken, "g"), char);
        });

        // 4. DIFF CALCULATION
        const dmp = new diff_match_patch();
        const diffs = dmp.diff_main(originalFullText, processedModifiedText);
        dmp.diff_cleanupSemantic(diffs);

        // 5. RECONSTRUCTION
        const containerFragments = new Map();
        uniqueContainers.forEach((c) => containerFragments.set(c, xmlDoc.createDocumentFragment()));
        if (!containerFragments.has(body)) containerFragments.set(body, xmlDoc.createDocumentFragment());

        const getParagraphInfo = (index) => {
            const match = paragraphMap.find((m) => index >= m.start && index < m.end);
            if (!match && paragraphMap.length > 0) {
                const last = paragraphMap[paragraphMap.length - 1];
                return { pPr: last.pPr, container: last.container };
            }
            return match ? { pPr: match.pPr, container: match.container } : { pPr: null, container: body };
        };

        const createNewParagraph = (pPr) => {
            const newP = xmlDoc.createElement("w:p");
            if (pPr) newP.appendChild(pPr.cloneNode(true));
            return newP;
        };

        let startInfo = getParagraphInfo(0);
        let currentParagraph = createNewParagraph(startInfo.pPr);
        let currentContainer = startInfo.container;
        let currentFragment = containerFragments.get(currentContainer);
        if (currentFragment) currentFragment.appendChild(currentParagraph);

        let currentOriginalIndex = 0;
        const usedReferenceTokens = new Set();

        const getRunProperties = (index) => {
            const match = propertyMap.find((m) => index >= m.start && index < m.end);
            return match ? { rPr: match.rPr, wrapper: match.wrapper } : { rPr: null };
        };

        const appendTextToCurrent = (text, type, rPr, wrapper, baseIndex) => {
            const parts = text.split(/([\n\uFFFC]|[\uE000-\uF8FF])/);
            let localOffset = 0;

            parts.forEach((part) => {
                if (part === "\n") {
                    if (type !== "delete") {
                        let pPr = null;
                        let targetContainer = currentContainer;

                        if (type === "equal") {
                            const lookupIndex = baseIndex + localOffset + 1;
                            const info = getParagraphInfo(lookupIndex);
                            pPr = info.pPr;
                            targetContainer = info.container;
                        } else {
                            const info = getParagraphInfo(baseIndex);
                            pPr = info.pPr;
                            targetContainer = info.container;
                        }

                        currentParagraph = createNewParagraph(pPr);
                        if (targetContainer !== currentContainer) {
                            currentContainer = targetContainer;
                            currentFragment = containerFragments.get(currentContainer);
                        }
                        if (currentFragment) currentFragment.appendChild(currentParagraph);
                    }
                    localOffset += 1;
                } else if (part === "\uFFFC") {
                    const sentinelIndex = baseIndex + localOffset;
                    const sentinel = sentinelMap.find((s) => s.start === sentinelIndex);

                    if (sentinel) {
                        const clone = sentinel.node.cloneNode(true);
                        if (sentinel.isTextBox && sentinel.originalContainer) {
                            const newContainer = clone.getElementsByTagName("w:txbxContent")[0];
                            if (newContainer) {
                                while (newContainer.firstChild) newContainer.removeChild(newContainer.firstChild);
                                replacementContainers.set(sentinel.originalContainer, newContainer);
                            }
                        }
                        if (sentinel.node.nodeName === "w:r" || sentinel.node.parentNode?.nodeName === "w:r") {
                            const run = xmlDoc.createElement("w:r");
                            if (rPr) run.appendChild(rPr.cloneNode(true));
                            run.appendChild(clone);
                            currentParagraph.appendChild(run);
                        } else {
                            currentParagraph.appendChild(clone);
                        }
                    }
                    localOffset += 1;
                } else if (referenceMap.has(part)) {
                    if (type !== "delete") {
                        const refNode = referenceMap.get(part);
                        if (refNode) {
                            const clone = refNode.cloneNode(true);
                            const run = xmlDoc.createElement("w:r");
                            if (rPr) run.appendChild(rPr.cloneNode(true));
                            run.appendChild(clone);
                            currentParagraph.appendChild(run);
                            let tokenString = "";
                            tokenToCharMap.forEach((c, t) => {
                                if (c === part) tokenString = t;
                            });
                            usedReferenceTokens.add(tokenString);
                        }
                    }
                    localOffset += part.length;
                } else if (part.length > 0) {
                    const run = xmlDoc.createElement("w:r");
                    if (rPr) run.appendChild(rPr.cloneNode(true));

                    let parent = currentParagraph;
                    if (wrapper) {
                        const wrapperClone = wrapper.cloneNode(false);
                        parent = wrapperClone;
                        currentParagraph.appendChild(wrapperClone);
                    }

                    const t = type === "delete" ? xmlDoc.createElement("w:delText") : xmlDoc.createElement("w:t");
                    t.setAttribute("xml:space", "preserve");
                    t.textContent = part;

                    run.appendChild(t);

                    if (type === "delete") {
                        const del = xmlDoc.createElement("w:del");
                        del.setAttribute("w:id", Math.floor(Math.random() * 10000).toString());
                        del.setAttribute("w:author", "Vibe");
                        del.setAttribute("w:date", new Date().toISOString());
                        del.appendChild(run);
                        parent.appendChild(del);
                    } else if (type === "insert") {
                        const ins = xmlDoc.createElement("w:ins");
                        ins.setAttribute("w:id", Math.floor(Math.random() * 10000).toString());
                        ins.setAttribute("w:author", "Vibe");
                        ins.setAttribute("w:date", new Date().toISOString());
                        ins.appendChild(run);
                        parent.appendChild(ins);
                    } else {
                        parent.appendChild(run);
                    }
                    localOffset += part.length;
                }
            });
        };

        for (const diff of diffs) {
            const [op, text] = diff;
            if (op === 0) {
                let offset = 0;
                while (offset < text.length) {
                    const props = getRunProperties(currentOriginalIndex + offset);
                    const currentPropRange = propertyMap.find(
                        (m) => currentOriginalIndex + offset >= m.start && currentOriginalIndex + offset < m.end,
                    );
                    let length = currentPropRange
                        ? Math.min(currentPropRange.end - (currentOriginalIndex + offset), text.length - offset)
                        : 1;
                    const chunk = text.substring(offset, offset + length);
                    appendTextToCurrent(chunk, "equal", props.rPr || null, props.wrapper, currentOriginalIndex + offset);
                    offset += length;
                }
                currentOriginalIndex += text.length;
            } else if (op === 1) {
                const isStartOfParagraph = paragraphMap.some((p) => p.start === currentOriginalIndex);
                const props =
                    currentOriginalIndex > 0 && !isStartOfParagraph
                        ? getRunProperties(currentOriginalIndex - 1)
                        : getRunProperties(currentOriginalIndex);
                appendTextToCurrent(text, "insert", props.rPr || null, props.wrapper, currentOriginalIndex);
            } else if (op === -1) {
                let offset = 0;
                while (offset < text.length) {
                    const props = getRunProperties(currentOriginalIndex + offset);
                    const currentPropRange = propertyMap.find(
                        (m) => currentOriginalIndex + offset >= m.start && currentOriginalIndex + offset < m.end,
                    );
                    let length = currentPropRange
                        ? Math.min(currentPropRange.end - (currentOriginalIndex + offset), text.length - offset)
                        : 1;
                    const chunk = text.substring(offset, offset + length);
                    appendTextToCurrent(chunk, "delete", props.rPr || null, props.wrapper, currentOriginalIndex + offset);
                    offset += length;
                }
                currentOriginalIndex += text.length;
            }
        }

        paragraphs.forEach((p) => {
            if (p.parentNode) p.parentNode.removeChild(p);
        });

        containerFragments.forEach((fragment, container) => {
            const replacement = replacementContainers.get(container);
            const target = replacement || container;
            target.appendChild(fragment);
        });

        return { oxml: serializer.serializeToString(xmlDoc), hasChanges: true };
    }

    function sanitizeAiResponse(text) {
        let cleaned = text;
        cleaned = cleaned.replace(/^(Here is the redline:|Here is the text:|Sure, I can help:|Here's the updated text:)\s*/i, "");
        cleaned = cleaned.replace(/\$\\text\{/g, "").replace(/\}\$/g, "");
        cleaned = cleaned.replace(/\$([^0-9\n]+?)\$/g, "$1");
        return cleaned;
    }

    // ==========================================
    // NETWORK LAYER
    // ==========================================

    async function fetchModelsFromGoogle(apiKey: string): Promise<any[]> {
        if (!apiKey) throw new Error("No API Key");
        const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
        const response = await fetch(url);
        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error?.message || "Failed to fetch models");
        }
        const data = await response.json();
        return (data.models || [])
            .filter((m) => m.supportedGenerationMethods?.includes("generateContent"))
            .sort((a, b) => b.name.localeCompare(a.name));
    }

    async function callGemini(apiKey: string, model: string, prompt: string, mode: "ASK" | "REDLINE" | "DRAFT" | "TABLE_EDIT" | "HYBRID_MIXED"): Promise<string> {
        if (!apiKey) throw new Error("API Key missing.");
        const cleanModel = (model || "gemini-1.5-flash").replace(/^models\//, "");
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${cleanModel}:generateContent?key=${apiKey}`;

        let systemInstruction = "";
        let responseFormat = "text/plain";

        if (mode === "REDLINE") {
            systemInstruction = "SYSTEM: You are a strict legal editor. Return ONLY the modified legal text. No markdown. No quotes. Do not use LaTeX. Preserve placeholders like [Name]. CRITICAL: Do not add explanations, just return the edited text.";
        } else if (mode === "DRAFT") {
            systemInstruction = "SYSTEM: You are an expert legal drafter. Write a clean, professional clause based on the instruction. Return ONLY the clause text.";
        } else if (mode === "TABLE_EDIT") {
            systemInstruction = `SYSTEM: You are a precise table editor. You will receive a text representation of a table and an instruction.
            You must identify which cells need to change.
            Return a JSON object with a "changes" array.
            Each change should be: { "type": "update_cell", "location": { "row": <index>, "col": <index> }, "content": "<new content>" }.
            Row and Column indices are 0-based.
            Example: { "changes": [{ "type": "update_cell", "location": { "row": 0, "col": 1 }, "content": "New Value" }] }
            Return ONLY valid JSON.`;
            responseFormat = "application/json";
        } else if (mode === "HYBRID_MIXED") {
            systemInstruction = `SYSTEM: You are a legal editor handling a document with both text and tables.
            Tables are marked with placeholders like {{__VIBE_TABLE_0__}}. DO NOT REMOVE OR MODIFY THESE PLACEHOLDERS.
            
            Your task:
            1. Edit the text based on the instruction.
            2. If the instruction applies to content INSIDE a table (represented by a placeholder), add an entry to the "table_edits" array.
            
            Return a JSON object:
            {
                "modified_text": "<the full text with edits and placeholders preserved>",
                "table_edits": [
                    { "placeholder": "{{__VIBE_TABLE_0__}}", "changes": [ { "type": "update_cell", "location": { "row": 0, "col": 1 }, "content": "New Value" } ] }
                ]
            }
            Return ONLY valid JSON.`;
            responseFormat = "application/json";
        } else {
            systemInstruction = "SYSTEM: You are a Senior Legal Counsel. Format response with Markdown (**bold**, lists). Be concise.";
        }

        const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: `${systemInstruction}\n\nUSER: ${prompt}` }] }] }),
        });

        if (!response.ok) throw new Error("Gemini API Error");
        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
    }

    function renderMarkdown(text: string): string {
        if (!text) return "";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
            .replace(/\*(.*?)\*/g, "<em>$1</em>")
            .replace(/\n/g, "<br>");
    }

    // ==========================================
    // UI COMPONENTS (React)
    // ==========================================

    const fontStack = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

    const Header = ({ onSettingsClick }) =>
        React.createElement("div", { style: { padding: "14px 16px", borderBottom: "1px solid #e5e5e5", display: "flex", justifyContent: "space-between", alignItems: "center", background: "#fff" } },
            React.createElement("div", null,
                React.createElement("h2", { style: { margin: 0, fontSize: "14px", fontWeight: "600", color: "#111", fontFamily: fontStack } }, "Vibe Legal V5.1"),
            ),
            React.createElement("button", { onClick: onSettingsClick, style: { background: "none", border: "none", cursor: "pointer", fontSize: "16px", opacity: 0.7, padding: "4px" } }, "⚙️"),
        );

    const Settings = ({ apiKey, setApiKey, selectedModel, setSelectedModel, onBack }) => {
        const [status, setStatus] = React.useState("");
        const [models, setModels] = React.useState([]);

        React.useEffect(() => { if (apiKey) handleSync(); }, []);

        const handleSync = async () => {
            setStatus("Loading...");
            try {
                const list = await fetchModelsFromGoogle(apiKey);
                setModels(list);
                setStatus(list.length + " models found");
                const currentExists = list.find((m) => m.name.replace("models/", "") === selectedModel);
                if (!currentExists && list.length > 0) setSelectedModel(list[0].name.replace("models/", ""));
            } catch (e) {
                setStatus("Error: Check Key");
                setModels([]);
            }
        };

        return React.createElement("div", { style: { padding: "20px", background: "#f9f9f9", height: "100%", fontFamily: fontStack, fontSize: "13px" } },
            React.createElement("h3", { style: { marginTop: 0, fontSize: "14px", marginBottom: "20px" } }, "Settings"),
            React.createElement("div", { style: { marginBottom: "20px" } },
                React.createElement("label", { style: { display: "block", fontWeight: "600", marginBottom: "6px", color: "#444" } }, "API Key"),
                React.createElement("input", { type: "password", value: apiKey, onChange: (e) => setApiKey(e.target.value), style: { width: "100%", padding: "10px", border: "1px solid #ddd", borderRadius: "6px", fontSize: "13px" }, placeholder: "Enter Gemini API Key" }),
            ),
            React.createElement("div", { style: { marginBottom: "20px" } },
                React.createElement("div", { style: { display: "flex", justifyContent: "space-between", marginBottom: "6px" } },
                    React.createElement("label", { style: { fontWeight: "600", color: "#444" } }, "Model"),
                    React.createElement("button", { onClick: handleSync, style: { fontSize: "11px", background: "none", border: "none", color: "#000", textDecoration: "underline", cursor: "pointer" } }, "Refresh"),
                ),
                React.createElement("select", { value: selectedModel, onChange: (e) => setSelectedModel(e.target.value), style: { width: "100%", padding: "10px", border: "1px solid #ddd", borderRadius: "6px", fontSize: "13px", background: "#fff" } },
                    models.length > 0
                        ? models.map((m) => React.createElement("option", { key: m.name, value: m.name.replace("models/", "") }, m.displayName || m.name))
                        : React.createElement("option", { value: selectedModel }, selectedModel || "Default"),
                ),
                React.createElement("div", { style: { fontSize: "11px", color: "#666", marginTop: "6px" } }, status),
            ),
            React.createElement("button", { onClick: () => { localStorage.setItem("vibe_api_key", apiKey); localStorage.setItem("vibe_model", selectedModel); onBack(); }, style: { width: "100%", background: "#000", color: "#fff", padding: "12px", border: "none", borderRadius: "6px", cursor: "pointer", fontWeight: "600", fontSize: "13px" } }, "Done"),
        );
    };

    const ModeSwitch = ({ mode, setMode }) => {
        const btn = (active) => ({ flex: 1, padding: "8px", border: active ? "1px solid #000" : "1px solid #e5e5e5", background: active ? "#000" : "#fff", color: active ? "#fff" : "#666", cursor: "pointer", fontSize: "12px", fontWeight: "500", transition: "0.2s", fontFamily: fontStack });
        return React.createElement("div", { style: { display: "flex", padding: "15px 16px 0", gap: "8px" } },
            React.createElement("button", { style: { ...btn(mode === "ASK"), borderRadius: "6px" }, onClick: () => setMode("ASK") }, "Ask"),
            React.createElement("button", { style: { ...btn(mode === "REDLINE"), borderRadius: "6px" }, onClick: () => setMode("REDLINE") }, "Redline"),
        );
    };

    const Chat = ({ messages }) => {
        const bottomRef = React.useRef(null);
        React.useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);
        return React.createElement("div", { style: { flexGrow: 1, overflowY: "auto", padding: "20px", display: "flex", flexDirection: "column", gap: "16px", fontFamily: fontStack } },
            messages.map((msg, i) =>
                React.createElement("div", { key: i, style: { alignSelf: msg.role === "user" ? "flex-end" : "flex-start", maxWidth: "90%" } },
                    React.createElement("div", { style: { background: msg.role === "user" ? "#000" : "#f4f4f4", color: msg.role === "user" ? "#fff" : "#111", padding: "10px 14px", borderRadius: "8px", fontSize: "13px", lineHeight: "1.5" }, dangerouslySetInnerHTML: { __html: renderMarkdown(msg.content) } }),
                ),
            ),
            React.createElement("div", { ref: bottomRef }),
        );
    };

    // ==========================================
    // MAIN APP
    // ==========================================

    const App = () => {
        const [view, setView] = React.useState("main");
        const [mode, setMode] = React.useState("ASK");
        const [apiKey, setApiKey] = React.useState("");
        const [selectedModel, setSelectedModel] = React.useState("gemini-1.5-flash");
        const [messages, setMessages] = React.useState([{ role: "bot", content: "**Vibe Legal V5.1** ready. Select text and use Redline, or Ask about the document." }]);
        const [inputValue, setInputValue] = React.useState("");
        const [isProcessing, setIsProcessing] = React.useState(false);

        React.useEffect(() => {
            const k = localStorage.getItem("vibe_api_key");
            const m = localStorage.getItem("vibe_model");
            if (k) setApiKey(k);
            if (m) setSelectedModel(m);
        }, []);

        const handleAction = async () => {
            if (!apiKey) return setView("settings");
            if (!inputValue.trim()) return;

            const currentInput = inputValue;
            setInputValue("");
            setMessages((p) => [...p, { role: "user", content: currentInput }]);
            setIsProcessing(true);

            try {
                await Word.run(async (context) => {
                    let selection = context.document.getSelection();

                    if (mode === "ASK") {
                        const body = context.document.body;
                        body.load("text");
                        await context.sync();
                        const answer = await callGemini(apiKey, selectedModel, `CONTEXT:\n"${body.text.substring(0, 30000)}"\n\nQUESTION:\n${currentInput}`, "ASK");
                        setMessages((p) => [...p, { role: "bot", content: answer }]);
                    } else {
                        selection.load("text");
                        await context.sync();
                        const originalSelectionText = selection.text;

                        if (!originalSelectionText || originalSelectionText.trim().length === 0) {
                            const draft = await callGemini(apiKey, selectedModel, currentInput, "DRAFT");
                            context.document.changeTrackingMode = Word.ChangeTrackingMode.trackAll;
                            selection.insertText(draft, Word.InsertLocation.replace);
                            await context.sync();
                            context.document.changeTrackingMode = Word.ChangeTrackingMode.off;
                            setMessages((p) => [...p, { role: "bot", content: "✅ Draft inserted with track changes." }]);
                        } else {
                            // CHECK FOR TABLE CONTEXT
                            const parentTable = selection.parentTableOrNullObject;
                            await context.sync();

                            if (!parentTable.isNullObject) {
                                // TABLE MODE: Operate on the table range directly without selecting it
                                console.log("[Vibe] Selection is inside a table. Using Table Mode.");
                                const tableRange = parentTable.getRange();
                                tableRange.load("text");
                                const tableOxmlResult = tableRange.getOoxml();
                                await context.sync();
                                
                                const fullTableText = tableRange.text;
                                const tableOxml = tableOxmlResult.value;
                                
                                const parser = new DOMParser();
                                const xmlDoc = parser.parseFromString(tableOxml, "text/xml");
                                
                                const tablePrompt = `INSTRUCTION: ${currentInput}\n\nUSER SELECTION: "${originalSelectionText}"\n\nFULL TABLE CONTEXT:\n${fullTableText}`;
                                const jsonResponse = await callGemini(apiKey, selectedModel, tablePrompt, "TABLE_EDIT");
                                console.log("[Vibe] Sniper Response:", jsonResponse);
                                
                                let edits = { changes: [] };
                                try {
                                    const cleanJson = jsonResponse.replace(/```json\n?|\n?```/g, "").trim();
                                    edits = JSON.parse(cleanJson);
                                } catch (e) {
                                    console.error("Failed to parse Table Sniper JSON:", e);
                                    setMessages((p) => [...p, { role: "bot", content: "❌ Error parsing table edits." }]);
                                    return;
                                }

                                const serializer = new XMLSerializer();
                                const result = applyTableSniperMode(xmlDoc, edits.changes || [], serializer);
                                
                                if (result.hasChanges) {
                                    // Replace the whole table
                                    tableRange.insertOoxml(result.oxml, Word.InsertLocation.replace);
                                    await context.sync();
                                    setMessages((p) => [...p, { role: "bot", content: "✅ Table updated successfully (Hybrid Mode)." }]);
                                } else {
                                    setMessages((p) => [...p, { role: "bot", content: "⚠️ No table changes detected." }]);
                                }

                            } else {
                                // NORMAL / MIXED SELECTION MODE
                                const oxmlResult = selection.getOoxml();
                                await context.sync();
                                const originalText = selection.text;
                                
                                // Check if the selection contains a table
                                const parser = new DOMParser();
                                const xmlDoc = parser.parseFromString(oxmlResult.value, "text/xml");
                                const tables = xmlDoc.getElementsByTagName("w:tbl");
                                const hasTables = tables.length > 0;

                                if (hasTables) {
                                    // MIXED MODE WITH TABLE: Use Hybrid Strategy
                                    console.log("[Vibe] Table detected in selection. Using Hybrid Mixed Mode.");
                                    
                                    // 1. HIDE TABLES
                                    const tableMap = hideTables(xmlDoc);
                                    
                                    // 2. GET TEXT WITH PLACEHOLDERS
                                    // We need to serialize the doc (now with placeholders) to get the text representation
                                    // But simpler: just extract text from the DOM now that tables are placeholders
                                    const serializer = new XMLSerializer();
                                    const textWithPlaceholders = extractTextWithStructure(xmlDoc);
                                    
                                    // 3. CALL GEMINI
                                    // We need to pass the table content too so the LLM knows what's inside the placeholders
                                    let tableContext = "";
                                    tableMap.forEach((tbl, placeholder) => {
                                        tableContext += `\n${placeholder} CONTENT:\n${tbl.textContent}\n`;
                                    });
                                    
                                    const hybridPrompt = `INSTRUCTION: ${currentInput}\n\nDOCUMENT TEXT:\n${textWithPlaceholders}\n\nTABLE CONTEXT:${tableContext}`;
                                    const jsonResponse = await callGemini(apiKey, selectedModel, hybridPrompt, "HYBRID_MIXED");
                                    console.log("[Vibe] Hybrid Response:", jsonResponse);
                                    
                                    let response = { modified_text: "", table_edits: [] };
                                    try {
                                        const cleanJson = jsonResponse.replace(/```json\n?|\n?```/g, "").trim();
                                        response = JSON.parse(cleanJson);
                                    } catch (e) {
                                        console.error("Failed to parse Hybrid JSON:", e);
                                        setMessages((p) => [...p, { role: "bot", content: "❌ Error parsing hybrid edits." }]);
                                        return;
                                    }

                                    // 4. RECONSTRUCT TEXT (Surrounding the tables)
                                    // We use the original text (with placeholders) vs modified text (with placeholders)
                                    // But wait, applyReconstructionMode expects the original OXML structure.
                                    // We already modified xmlDoc by hiding tables. That's good! 
                                    // We want to reconstruct the *text* parts of xmlDoc.
                                    
                                    // Re-serialize to get clean OXML with placeholders
                                    const placeholderOxml = serializer.serializeToString(xmlDoc);
                                    const reconstructionResult = applyReconstructionMode(
                                        new DOMParser().parseFromString(placeholderOxml, "text/xml"), // New doc to avoid mutation issues
                                        textWithPlaceholders, 
                                        response.modified_text, 
                                        serializer
                                    );
                                    
                                    // 5. RESTORE TABLES
                                    // Now we have a reconstructed doc with placeholders. We swap them back.
                                    const reconstructedDoc = new DOMParser().parseFromString(reconstructionResult.oxml, "text/xml");
                                    restoreTables(reconstructedDoc, tableMap);
                                    
                                    // 6. SNIPE TABLES
                                    // Now apply specific edits to the restored tables
                                    if (response.table_edits && response.table_edits.length > 0) {
                                        // Flatten edits: The LLM might group them by placeholder, but our sniper works on the whole doc
                                        // We need to map placeholder-relative edits to actual table indices?
                                        // Actually, applyTableSniperMode finds tables by index (0, 1, 2...).
                                        // If the LLM returns edits per placeholder, we need to know which table index that placeholder corresponds to.
                                        // Our hideTables used index. {{__VIBE_TABLE_0__}} is the 0th table.
                                        
                                        const allEdits = [];
                                        response.table_edits.forEach(editGroup => {
                                            const match = editGroup.placeholder.match(/__VIBE_TABLE_(\d+)__/);
                                            if (match) {
                                                const tableIndex = parseInt(match[1]);
                                                editGroup.changes.forEach(change => {
                                                    // Inject table index into location
                                                    change.location.table = tableIndex;
                                                    allEdits.push(change);
                                                });
                                            }
                                        });
                                        
                                        applyTableSniperMode(reconstructedDoc, allEdits, serializer);
                                    }
                                    
                                    // 7. FINALIZE
                                    const finalOxml = serializer.serializeToString(reconstructedDoc);
                                    selection.insertOoxml(finalOxml, Word.InsertLocation.replace);
                                    await context.sync();
                                    setMessages((p) => [...p, { role: "bot", content: "✅ Hybrid update applied (Text + Tables)." }]);

                                } else {
                                    // PURE TEXT REDLINE MODE
                                    console.log("[Vibe] Original text:", originalText.substring(0, 100));
                                    const modifiedText = await callGemini(apiKey, selectedModel, `INSTRUCTION: ${currentInput}\n\nORIGINAL TEXT:\n${originalText}`, "REDLINE");
                                    console.log("[Vibe] Modified text:", modifiedText.substring(0, 100));
                                    
                                    const result = applyRedlineToOxml(oxmlResult.value, originalText, modifiedText);
                                    
                                    if (result.hasChanges) {
                                        selection.insertOoxml(result.oxml, Word.InsertLocation.replace);
                                        await context.sync();
                                        setMessages((p) => [...p, { role: "bot", content: "✅ Redline applied successfully." }]);
                                    } else {
                                        setMessages((p) => [...p, { role: "bot", content: "⚠️ No changes detected." }]);
                                    }
                                }
                            }
                        }
                    }
                });
            } catch (e) {
                console.error(e);
                setMessages((p) => [...p, { role: "bot", content: "❌ Error: " + e.message }]);
            } finally {
                setIsProcessing(false);
            }
        };

        // TABLE SNIPER MODE
        function applyTableSniperMode(xmlDoc, edits, serializer) {
            let hasChanges = false;
            const tables = xmlDoc.getElementsByTagName("w:tbl");
            
            // Helper to find a cell by row/col index
            const findCell = (tableIndex, rowIndex, colIndex) => {
                if (tableIndex >= tables.length) return null;
                const table = tables[tableIndex];
                const rows = Array.from(table.getElementsByTagName("w:tr"));
                if (rowIndex >= rows.length) return null;
                const row = rows[rowIndex];
                const cells = Array.from(row.getElementsByTagName("w:tc"));
                if (colIndex >= cells.length) return null;
                return cells[colIndex];
            };

            for (const edit of edits) {
                if (edit.type === "update_cell") {
                    const cell = findCell(edit.location.table || 0, edit.location.row, edit.location.col);
                    if (cell) {
                        // Extract current text for context
                        const currentText = cell.textContent || "";
                        const newText = edit.content || ""; // Fix: Ensure not null
                        
                        // Extract children of cell to create a "body-like" structure
                        let cellContentXml = "";
                        Array.from(cell.childNodes).forEach(child => {
                             cellContentXml += serializer.serializeToString(child);
                        });
                        
                        // Create a fake document where the body contains the cell's paragraphs directly
                        const fakeDocStr = `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${cellContentXml}</w:body></w:document>`;
                        
                        // We use the reconstruction mode on this mini-document
                        const result = applyReconstructionMode(
                            new DOMParser().parseFromString(fakeDocStr, "text/xml"), 
                            currentText, 
                            newText, 
                            serializer
                        );
                        
                        if (result.hasChanges) {
                            // The result.oxml is a full document string. 
                            // The body of this result doc contains the new paragraphs for the cell.
                            const resultDoc = new DOMParser().parseFromString(result.oxml, "text/xml");
                            const resultBody = resultDoc.getElementsByTagName("w:body")[0];
                            
                            if (resultBody) {
                                // Clear the current cell
                                while (cell.firstChild) cell.removeChild(cell.firstChild);
                                
                                // Import new children from resultBody to the cell
                                Array.from(resultBody.childNodes).forEach(child => {
                                    const importedNode = xmlDoc.importNode(child, true);
                                    cell.appendChild(importedNode);
                                });
                                hasChanges = true;
                            }
                        }
                    }
                }
            }
            
            return { oxml: serializer.serializeToString(xmlDoc), hasChanges };
        }

        if (view === "settings")
            return React.createElement(Settings, { apiKey, setApiKey, selectedModel, setSelectedModel, onBack: () => setView("main") });

        return React.createElement("div", { className: "vibe-layout", style: { fontFamily: fontStack, height: "100vh", display: "flex", flexDirection: "column", background: "#fff" } },
            React.createElement(Header, { onSettingsClick: () => setView("settings") }),
            React.createElement(ModeSwitch, { mode, setMode }),
            React.createElement(Chat, { messages }),
            React.createElement("div", { style: { padding: "16px 20px", borderTop: "1px solid #f0f0f0", display: "flex", gap: "10px", background: "#fff", alignItems: "flex-end" } },
                React.createElement("textarea", {
                    placeholder: mode === "ASK" ? "Ask about document..." : "Type instruction...",
                    value: inputValue,
                    onChange: (e) => setInputValue(e.target.value),
                    onKeyDown: (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleAction(); } },
                    style: { flexGrow: 1, padding: "12px", border: "1px solid #ddd", borderRadius: "8px", resize: "none", height: "48px", fontSize: "13px", outline: "none", fontFamily: "inherit" },
                }),
                React.createElement("button", {
                    onClick: handleAction,
                    disabled: isProcessing,
                    style: { width: "48px", height: "48px", background: isProcessing ? "#eee" : "#000", color: "#fff", border: "none", borderRadius: "8px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" },
                }, isProcessing ? "..." : "➤"),
            ),
        );
    };

    // HELPER FUNCTIONS
    function createTextRun(xmlDoc, text, rPr, isDeleted) {
        const r = xmlDoc.createElement("w:r");
        if (rPr) {
            const newRPr = rPr.cloneNode(true);
            r.appendChild(newRPr);
        }
        
        if (isDeleted) {
            const delText = xmlDoc.createElement("w:delText");
            delText.textContent = text;
            delText.setAttribute("xml:space", "preserve");
            r.appendChild(delText);
        } else {
            const t = xmlDoc.createElement("w:t");
            t.textContent = text;
            t.setAttribute("xml:space", "preserve");
            r.appendChild(t);
        }
        return r;
    }

    function createTrackChange(xmlDoc, type, run) {
        const wrapper = xmlDoc.createElement(type === 'del' ? "w:del" : "w:ins");
        wrapper.setAttribute("w:id", Math.floor(Math.random() * 10000).toString());
        wrapper.setAttribute("w:author", "Vibe Legal");
        wrapper.setAttribute("w:date", new Date().toISOString());
        wrapper.appendChild(run);
        return wrapper;
    }

    function hideTables(xmlDoc) {
        const tables = Array.from(xmlDoc.getElementsByTagName("w:tbl"));
        const tableMap = new Map();
        
        tables.forEach((tbl: any, index) => {
            const placeholder = `{{__VIBE_TABLE_${index}__}}`;
            tableMap.set(placeholder, tbl);
            
            // Create placeholder paragraph
            const p = xmlDoc.createElement("w:p");
            const r = xmlDoc.createElement("w:r");
            const t = xmlDoc.createElement("w:t");
            t.textContent = placeholder;
            r.appendChild(t);
            p.appendChild(r);
            
            // Replace table with placeholder
            if (tbl.parentNode) {
                tbl.parentNode.replaceChild(p, tbl);
            }
        });
        
        return tableMap;
    }

    function restoreTables(xmlDoc, tableMap) {
        const paragraphs = Array.from(xmlDoc.getElementsByTagName("w:p"));
        
        paragraphs.forEach((p: any) => {
            const text = p.textContent || "";
            // Check if paragraph is EXACTLY the placeholder (or contains it)
            // We iterate map to find match
            tableMap.forEach((originalTable, placeholder) => {
                if (text.includes(placeholder)) {
                    // Found a placeholder! Replace paragraph with original table.
                    // Note: If the LLM wrapped it in other text, that text is lost. 
                    // We assume LLM preserves placeholder as a distinct block.
                    if (p.parentNode) {
                        p.parentNode.replaceChild(originalTable, p);
                    }
                }
            });
        });
    }

    function extractTextWithStructure(xmlDoc) {
        const paragraphs = Array.from(xmlDoc.getElementsByTagName("w:p"));
        return paragraphs.map((p: any) => {
            return p.textContent || "";
        }).join("\n");
    }

    Office.onReady(() => ReactDOM.render(React.createElement(App), document.getElementById("root")));
  language: typescript
template:
  content: |
    <div id="root"></div>
  language: html
style:
  content: |
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fff; }
    * { box-sizing: border-box; }
  language: css
libraries: |
  https://appsforoffice.microsoft.com/lib/1/hosted/office.js
  https://unpkg.com/react@17/umd/react.development.js
  https://unpkg.com/react-dom@17/umd/react-dom.development.js
  https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js

